<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Dashboard</title>
<style>
  :root{
    --bg:#14121f; --panel:#1e1b2e; --panel2:#262238; --ink:#e8e5f4; --dim:#9b95b8;
    --line:rgba(255,255,255,.09); --accent:#ff9f43; --ok:#3ecf8e; --bad:#ff5470; --warn:#ffc53f;
    --chip:#312c4a; --mono:ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif;padding-bottom:60px}
  header{display:flex;align-items:baseline;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:17px;letter-spacing:.4px}
  header .meta{color:var(--dim);font-size:12px}
  .light{font-size:13px;padding:2px 10px;border-radius:2px;background:var(--chip)}
  nav{display:flex;gap:2px;padding:10px 22px 0}
  nav button{background:var(--panel);border:1px solid var(--line);border-bottom:none;color:var(--dim);
    padding:8px 18px;cursor:pointer;font:inherit;font-size:13px}
  nav button.on{background:var(--panel2);color:var(--ink);border-top:2px solid var(--accent)}
  main{padding:16px 22px;display:grid;gap:14px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);padding:14px 16px}
  .card h2{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  .card.wide{grid-column:1/-1}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{color:var(--dim);text-align:left;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;padding:4px 8px 6px 0}
  td{padding:5px 8px 5px 0;border-top:1px solid var(--line);vertical-align:top}
  .chip{display:inline-block;background:var(--chip);padding:1px 8px;font-size:11px;border-radius:2px;white-space:nowrap}
  .chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.dim{color:var(--dim)}
  .idlink{color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:.93em}
  .idlink:hover{text-decoration:underline}
  a{color:var(--accent)} .dim{color:var(--dim)} .mono{font-family:var(--mono);font-size:12px}
  .bar{height:7px;background:var(--chip);margin:8px 0 4px;position:relative}
  .bar i{position:absolute;inset:0;right:auto;background:var(--ok)}
  ul.clean{list-style:none} ul.clean li{padding:6px 0;border-top:1px solid var(--line)}
  ul.clean li:first-child{border-top:none}
  .phasestrip{display:flex;gap:6px;flex-wrap:wrap}
  .phasestrip .ph{padding:6px 10px;background:var(--chip);font-size:12px;border:1px solid transparent;min-width:52px;text-align:center}
  .phasestrip .ph.cur{border-color:var(--accent);color:var(--accent);font-weight:700}
  .phasestrip .ph small{display:block;color:var(--dim);font-size:9.5px;font-weight:400;max-width:130px}
  input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:7px 10px;font:inherit;width:240px}
  button.act{background:var(--accent);border:none;color:#241303;font:inherit;font-weight:700;padding:7px 14px;cursor:pointer}
  .stub{color:var(--dim);font-size:12.5px}
  .stub .mono{color:var(--dim)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:12.5px}
  .kv b{color:var(--dim);font-weight:600}
  .tracebucket h3{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin:12px 0 4px}
  .hit{padding:4px 0;border-top:1px solid var(--line);font-size:12.5px}
  .hit .mono{color:var(--dim)}
  .err{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1 id="appName">Owner Dashboard</h1>
  <span class="light" id="healthLight">…</span>
  <span class="meta" id="phaseNow"></span>
  <span class="meta" id="rootMeta"></span>
  <span class="meta" style="margin-left:auto"><a href="#" onclick="load();return false">refresh</a></span>
</header>
<nav>
  <button id="tab-pre" onclick="show('pre')">Pre-dev</button>
  <button id="tab-in" onclick="show('in')">In-dev</button>
  <button id="tab-post" onclick="show('post')">Post-dev</button>
  <button id="tab-trace" onclick="show('trace')">ID trace</button>
</nav>
<main id="main"><div class="card">Loading…</div></main>

<script>
let M = null, view = 'in';
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// linkify stable IDs → clickable trace chips
const link = (s) => esc(s).replace(/\b([A-Z][A-Z0-9]{1,7}-\d{1,4}|AC-[A-Z0-9]{2,10}-\d{1,3}|OQ-\d{1,4})\b/g,
  '<span class="idlink" onclick="traceId(\'$1\')">$1</span>');

async function load() {
  M = await (await fetch('/api/model')).json();
  document.getElementById('appName').textContent = M.appName;
  document.getElementById('rootMeta').textContent = M.layout + ' · ' + M.root;
  const h = M.health;
  const hl = document.getElementById('healthLight');
  hl.textContent = h ? h.overall : 'no health file';
  hl.style.color = h ? (h.red ? 'var(--bad)' : 'var(--ok)') : 'var(--dim)';
  document.getElementById('phaseNow').textContent = M.roadmap.current ? 'you are here: ' + M.roadmap.current : '';
  show(view);
}

function show(v) {
  view = v;
  for (const t of ['pre','in','post','trace'])
    document.getElementById('tab-'+t).className = t===v ? 'on' : '';
  const main = document.getElementById('main');
  main.innerHTML = '';
  if (!M) return;
  if (v==='pre') renderPre(main);
  if (v==='in') renderIn(main);
  if (v==='post') renderPost(main);
  if (v==='trace') renderTrace(main);
}

const card = (title, html, wide) => `<div class="card${wide?' wide':''}"><h2>${title}</h2>${html}</div>`;

// ---------- PRE-DEV ----------
function renderPre(main) {
  const g = $( `<div class="grid"></div>` ).firstChild;
  g.innerHTML =
    card('The idea — one pager', M.vision ? `<div style="white-space:pre-wrap;font-size:13px">${link(M.vision)}</div>` : '<span class="dim">product-spec §1 not found</span>', true) +
    card('Personas', M.personas.length ? '<table><tr><th>Persona</th><th>Loves</th><th>Return trigger</th></tr>' +
      M.personas.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.loves)}</td><td class="dim">${esc(p.returns)}</td></tr>`).join('') + '</table>' : '<span class="dim">none parsed</span>') +
    card('Roadmap — you are here', phaseStrip() ) +
    card('Owner decision ledger', ownerLedger(), true) +
    card('Open questions — the inbox (readable)', oqList(), true) +
    card('Decisions — why things are the way they are', decisionsList(), true);
  main.appendChild(g);
}

function phaseStrip() {
  if (!M.roadmap.phases.length) return '<span class="dim">roadmap table not parsed</span>';
  return '<div class="phasestrip">' + M.roadmap.phases.map(p =>
    `<div class="ph${p.id===M.roadmap.current?' cur':''}" title="${esc(p.exit)}">${esc(p.id)}<small>${esc(p.goal.slice(0,40))}</small></div>`).join('') + '</div>' +
    `<p class="dim" style="margin-top:8px;font-size:12px">hover a phase for its exit criteria · gates: ${
      M.roadmap.phases.filter(p=>/yes/i.test(p.ownerGate)).map(p=>p.id).join(', ') || '—'}</p>`;
}

function ownerLedger() {
  const pending = M.openQuestions.filter(q=>!q.resolved && q.ownerCall);
  const decided = M.decisions.slice(0, 8);
  let h = '<h2 style="margin-top:2px">PENDING — only you can rule these</h2>';
  h += pending.length ? '<ul class="clean">' + pending.map(q =>
    `<li><span class="chip warn">PENDING</span> <span class="idlink" onclick="traceId('${q.id}')">${q.id}</span>
     ${q.blocks?`<span class="chip bad">blocks ${esc(q.blocks)}</span>`:''} ${link(q.text)}</li>`).join('') + '</ul>'
    : '<p class="dim">none — nothing is waiting on you ✅</p>';
  h += '<h2 style="margin-top:14px">RECENTLY DECIDED</h2><ul class="clean">' + decided.map(d =>
    `<li><span class="chip ok">DECIDED</span> <a href="/doc/${esc(d.file)}" target="_blank" class="mono">${esc(d.id)}</a> ${link(d.title)} <span class="dim">${esc(d.date)}</span></li>`).join('') + '</ul>';
  return h;
}

function oqList() {
  const open = M.openQuestions.filter(q=>!q.resolved);
  if (!open.length) return '<p class="dim">inbox empty ✅</p>';
  return '<ul class="clean">' + open.map(q =>
    `<li><span class="idlink" onclick="traceId('${q.id}')">${q.id}</span>
     ${q.ownerCall?'<span class="chip warn">owner</span>':''} ${q.blocks?`<span class="chip dim">${esc(q.blocks)}</span>`:''}
     ${link(q.text)}</li>`).join('') + '</ul>';
}

function decisionsList() {
  if (!M.decisions.length) return '<p class="dim">none parsed</p>';
  return '<ul class="clean">' + M.decisions.map(d =>
    `<li><a class="mono" href="/doc/${esc(d.file)}" target="_blank">${esc(d.id)}</a> ${link(d.title)} <span class="dim">${esc(d.date)}</span></li>`).join('') + '</ul>';
}

// ---------- IN-DEV ----------
function renderIn(main) {
  const g = $(`<div class="grid"></div>`).firstChild;
  const pd = M.phaseDetail;
  const total = pd ? pd.done + pd.open : 0;
  g.innerHTML =
    card('Health', healthPanel()) +
    card(`Current phase — ${esc(M.roadmap.current ?? '?')}`,
      pd ? `<div class="dim" style="font-size:12px">${link(pd.title)}</div>
            <div class="bar"><i style="width:${total?Math.round(100*pd.done/total):0}%"></i></div>
            <div class="dim" style="font-size:12px">${pd.done}/${total} checklist items done · <a href="/doc/${esc(pd.source)}" target="_blank">open source doc</a></div>
            ${pd.acs?.length ? '<div style="margin-top:6px">'+pd.acs.map(a=>`<span class="idlink" onclick="traceId('${a}')">${a}</span>`).join(' · ')+'</div>':''}`
         : '<span class="dim">no phase checklist found — the walkthrough/DoD doc appears here when it exists</span>') +
    card('What\'s next', M.upNext.length ? '<ul class="clean">'+M.upNext.map(u=>`<li>${link(u)}</li>`).join('')+'</ul>' : '<span class="dim">no queue parsed</span>') +
    card('Surfaces — click a mockup to open it', surfacesTable(), true);
  main.appendChild(g);
}

function healthPanel() {
  const h = M.health;
  if (!h) return '<span class="dim">no generated health file — run the health check</span>';
  return `<div style="font-size:15px;margin-bottom:6px">${esc(h.overall)}</div>
    <div class="dim" style="font-size:12px">generated ${esc(h.generated)}</div>` +
    (h.attention.length ? '<ul class="clean">'+h.attention.map(a=>`<li class="err">${link(a)}</li>`).join('')+'</ul>'
      : '<p class="dim" style="margin-top:6px">nothing needs attention ✅</p>');
}

function surfacesTable() {
  if (!M.surfaces.length) return '<span class="dim">no surface table parsed</span>';
  const stateChip = (s) => {
    const cls = /✅|converged/i.test(s) ? 'ok' : /🔶|in ?pass|partial/i.test(s) ? 'warn' : 'dim';
    return `<span class="chip ${cls}">${esc(s.slice(0,28))}</span>`;
  };
  const cell = (v) => /✅/.test(v??'') ? '<span class="chip ok">✅</span>' : /🔶/.test(v??'') ? '<span class="chip warn">🔶</span>' : `<span class="chip dim">${esc((v??'—').slice(0,10))}</span>`;
  return '<table><tr><th>§</th><th>Screen</th><th>State</th><th>Mockup</th><th>Spec</th><th>API</th></tr>' +
    M.surfaces.map(s => `<tr>
      <td class="dim">${esc(s.id)}</td><td><b>${esc(s.screen)}</b></td><td>${stateChip(s.state)}</td>
      <td>${s.implementsFrom ? `<a href="/mockup/${encodeURI(s.implementsFrom)}" target="_blank" class="mono">${esc(s.implementsFrom)}</a>` : '<span class="dim">—</span>'}</td>
      <td>${cell(s.designSpec)}</td><td>${cell(s.api)}</td></tr>`).join('') + '</table>';
}

// ---------- POST-DEV ----------
const PANELS = [
  ['release',  'Release status',      'stage · store review state · rollout %'],
  ['crashes',  'Crash / error rate',  'crash-free % · top errors (Sentry export)'],
  ['retention','Per-persona retention','D1/D7/D30 by persona proxy (analytics export)'],
  ['economy',  'Economy health',      'currency sinks/sources · ledger drift (if money exists)'],
  ['modqueue', 'Moderation queue',    'open reports · median age (if UGC exists)'],
  ['support',  'Support inbox',       'open tickets · oldest unanswered'],
  ['cost',     'Run cost',            'monthly infra + services vs budget'],
];
function renderPost(main) {
  const g = $(`<div class="grid"></div>`).firstChild;
  g.innerHTML = PANELS.map(([key, title, expects]) => {
    const data = M.postDev?.[key];
    if (!data) return card(title, `<div class="stub">not wired yet — drop <span class="mono">.dashboard/${key}.json</span> in the project root and this panel lights up.<br><span class="dim">expects: ${esc(expects)}</span></div>`);
    return card(title, '<div class="kv">' + Object.entries(data).map(([k,v]) =>
      `<b>${esc(k)}</b><span>${typeof v==='object'?esc(JSON.stringify(v)):link(String(v))}</span>`).join('') + '</div>');
  }).join('');
  main.appendChild(g);
}

// ---------- TRACE ----------
let lastTrace = null;
function renderTrace(main) {
  const g = $(`<div class="grid"></div>`).firstChild;
  g.innerHTML = card('Single-ID trace — spec → api → design → mockup → code → test → decision',
    `<div style="display:flex;gap:8px;margin-bottom:6px">
       <input type="text" id="traceIn" placeholder="e.g. CARD-15 · SYS-07 · OQ-124 · 0046" value="${esc(lastTrace?.id ?? '')}">
       <button class="act" onclick="traceId(document.getElementById('traceIn').value)">trace</button>
     </div><div id="traceOut">${lastTrace ? traceHtml(lastTrace) : '<span class="dim">every orange ID anywhere in this dashboard is clickable — or type one.</span>'}</div>`, true);
  main.appendChild(g);
}
async function traceId(id) {
  id = id.trim(); if (!id) return;
  show('trace');
  document.getElementById('traceOut').innerHTML = '<span class="dim">tracing ' + esc(id) + '…</span>';
  const r = await (await fetch('/api/trace?id=' + encodeURIComponent(id))).json();
  lastTrace = r;
  document.getElementById('traceIn').value = id;
  document.getElementById('traceOut').innerHTML = r.error ? `<span class="err">${esc(r.error)}</span>` : traceHtml(r);
}
function traceHtml(r) {
  if (!r.buckets.length) return `<span class="dim">no hits for <b>${esc(r.id)}</b> anywhere in the project.</span>`;
  return r.buckets.map(b => `<div class="tracebucket"><h3>${esc(b.bucket)} · ${b.hits.length}</h3>` +
    b.hits.map(h => `<div class="hit"><span class="mono">${esc(h.file)}:${h.line}</span> — ${esc(h.text)}</div>`).join('') + '</div>').join('');
}

load();
</script>
</body>
</html>
